# Both executables must start on Windows without the Visual C++ Redistributable, so the CRT is
# linked statically. Control Flow Guard checks indirect calls in the service's own code.
# RUSTFLAGS or CARGO_ENCODED_RUSTFLAGS in the environment replace these flags;
# build.rs rejects an MSVC build that lost crt-static that way.
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "control-flow-guard"]
